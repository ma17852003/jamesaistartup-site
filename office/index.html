<head>
<meta charset="UTF-8">

<title>AI造王者公司 · 3D 像素辦公室</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a1a; --panel:#12122a; --border:#2a2a5a; --text:#e0e0ff;
  --accent:#7c6fff; --gold:#ffd700; --green:#39ff14; --orange:#ff8c00; --red:#ff4444;
  --font-pixel:'Press Start 2P','Noto Sans TC',monospace;
  --ui-bar-bg:rgba(10,10,26,.88); --ui-legend-bg:rgba(10,10,26,.88);
  --ui-info-bg:rgba(13,13,43,.94); --ui-todo-bg:rgba(13,13,43,.95);
  --ui-hint:#667; --ui-infotext:#bbc;
  --hover-border:#7c6fff; --hover-glow:none;
  --btn-on-bg:#7c6fff; --btn-on-border:#7c6fff; --btn-on-text:#fff;
  --gold-dim:#b8860b; --btn-game-on-text:#fff;
  --shadow-ink:#000;
  --title-shadow:0 0 12px #ffd700,2px 2px 0 #000;
  --toast-bg:#ffd700; --toast-text:#0a0a1a; --toast-border:#fff; --toast-shadow:5px 5px 0 #000;
  --todo-row-bg:rgba(124,111,255,.05); --todo-row-hover:rgba(124,111,255,.15);
  --fx-overlay:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.07) 3px,rgba(0,0,0,.07) 6px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif}
#c{position:fixed;inset:0;display:block}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:10px 16px;background:var(--ui-bar-bg);backdrop-filter:blur(8px);border-bottom:2px solid var(--border);flex-wrap:wrap}
.bar .t{font-family:var(--font-pixel);font-size:15px;font-weight:900;color:var(--gold);text-shadow:var(--title-shadow)}
.bar .s{font-size:13px;color:var(--accent)}
.btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--font-pixel);font-size:10px;padding:8px 12px;background:var(--panel);
  border:2px solid var(--border);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--hover-border);box-shadow:var(--hover-glow)}
.btn.on{background:var(--btn-on-bg);border-color:var(--btn-on-border);color:var(--btn-on-text)}
.btn.game{border-color:var(--gold-dim);color:var(--gold)}
.btn.game:hover{border-color:var(--gold)}
.btn.game.on{background:var(--gold-dim);border-color:var(--gold);color:var(--btn-game-on-text)}
.sep{width:2px;height:24px;background:var(--border)}

/* 董事長公告 toast */
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:40;
  font-family:var(--font-pixel),'Noto Sans TC',monospace;font-size:12px;color:var(--toast-text);background:var(--toast-bg);
  border:3px solid var(--toast-border);box-shadow:var(--toast-shadow);padding:13px 20px;opacity:0;pointer-events:none;transition:all .25s;
  max-width:88vw;text-align:center;line-height:1.8}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* legend */
.legend{position:fixed;left:12px;bottom:calc(var(--dock-h,0px) + 12px);z-index:20;background:var(--ui-legend-bg);border:2px solid var(--border);
  padding:10px 12px;font-size:13px;line-height:2;max-width:215px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .sw{width:10px;height:10px;flex-shrink:0}
.legend .hint{color:var(--ui-hint);font-size:11px;margin-top:6px;line-height:1.6}

/* info card */
.info{position:fixed;right:12px;top:calc(64px + var(--kpi-h,0px));z-index:20;width:250px;background:var(--ui-info-bg);
  border:3px solid var(--accent);box-shadow:6px 6px 0 var(--shadow-ink);padding:16px;display:none}
.info.show{display:block}
.info .isp{font-size:34px;text-align:center;display:block;margin-bottom:8px}
.info .inm{font-family:var(--font-pixel);font-size:11px;color:var(--gold);text-align:center;margin-bottom:6px;line-height:1.8}
.info .idp{font-size:13px;color:var(--accent);text-align:center;margin-bottom:10px}
.info .itx{font-size:13px;color:var(--ui-infotext);line-height:1.9;border-top:1px solid var(--border);padding-top:10px}
.info .ibd{display:inline-block;font-size:11px;border:1px solid var(--accent);padding:2px 8px;margin-top:8px;color:var(--text)}
.info .ix{position:absolute;top:6px;right:8px;background:none;border:1px solid var(--red);color:var(--red);
  font-size:10px;padding:2px 7px;cursor:pointer}
.info .ix:hover{background:var(--red);color:#fff}

/* scanline / 網點 / 爐光 特效層(吃主題變數) */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:30;
  background:var(--fx-overlay)}
/* Live 待辦面板 */
.todo{position:fixed;right:12px;bottom:calc(var(--dock-h,0px) + 12px);z-index:22;width:325px;max-height:64vh;overflow-y:auto;
  background:var(--ui-todo-bg);border:3px solid var(--gold);box-shadow:6px 6px 0 var(--shadow-ink);padding:12px;display:none}
.todo.show{display:block}
.todo h3{font-family:var(--font-pixel);font-size:11px;color:var(--gold);margin:10px 0 6px;line-height:1.6}
.todo h3:first-child{margin-top:0}
.todo .row{display:flex;align-items:flex-start;gap:7px;font-size:13px;line-height:1.5;padding:6px 7px;
  border:1px solid var(--border);margin-bottom:4px;cursor:pointer;background:var(--todo-row-bg)}
.todo .row:hover{border-color:var(--accent);background:var(--todo-row-hover)}
.todo .dot{width:9px;height:9px;flex-shrink:0;margin-top:3px}
.todo .pj{color:var(--accent);font-size:11px}
.todo .deci{border-color:#5a3a10}
.todo .deci:hover{border-color:var(--gold)}
.todo .empty{color:var(--ui-hint);font-size:13px;padding:6px}

/* 主題字級/字重適配(規格書:press Syne 較窄需放大、foundry Silkscreen 微調) */
body.theme-press .bar .t{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
body.theme-press .btn{font-size:12px;font-weight:800}
body.theme-press .info .inm{font-size:13px;font-weight:800}
body.theme-press .toast{font-size:14px;font-weight:800}
body.theme-press .todo h3{font-weight:800}
body.theme-foundry .bar .t{font-weight:700}
body.theme-foundry .btn{font-size:11px}
@media(max-width:700px){.bar .s{display:none}.info{width:210px}}
</style>

/* 文字 sprite(字色/影色/字型烤進貼圖 → 全部吃「當前主題」CUR) */
function label(text,size,color,bg){
  const cv=document.createElement('canvas');const s=cv.getContext('2d');
  cv.width=512;cv.height=128;
  if(bg){s.fillStyle=bg;s.fillRect(0,0,512,128);}
  s.font=`900 ${size||44}px ${CUR.font.canvas}`;
  s.textAlign='center';s.textBaseline='middle';
  s.shadowColor=CUR.label.shadow;s.shadowBlur=CUR.label.shadowBlur;
  s.fillStyle=color||CUR.label.person;s.fillText(text,256,64);
  const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  if(!bg){const sb=CUR.label.shadowBlur||0;sp.userData.inkW=Math.min(1,(s.measureText(text).width+sb*2)/512);sp.userData.inkH=Math.min(1,((size||44)*1.15+sb*2)/128);} /* 墨水區比例：給月台泡泡碰撞用 */
  return sp;
}

/* ── 可愛人物造型（2026-11-12 James：髮型、臉型、穿著、身材每個人都不一樣，有男有女；CEO 層看過喜歡 → 鋪到全公司）──

   CEO 層 5 位是手排的（LOOKS）；其他人用代號算出造型（lookGen），名冊不變就每次都長一樣。

      所以點頭、轉頭是整顆頭一起動。手用 userData.parts.arms 取，不要再用 children[7][8] 這種位置。 */
const LOOK_OFF=new URLSearchParams(location.search).get('look')==='0';
const LOOK_BODY={S:[.52,.52,.36,.26],M:[.60,.60,.40,.32],L:[.54,.66,.38,.40],R:[.72,.60,.48,.28],B:[.70,.64,.44,.32]}; /* 身寬,身高,身深,腿高 */
const LOOK_FACE={round:[.76,.70,.64],square:[.80,.66,.64],long:[.68,.76,.60],small:[.70,.66,.60]};
const LOOK_SKIN={porcelain:0xFFE2C6,apricot:0xFFD9B0,wheat:0xE8B080,honey:0xC68A5A,deep:0x8D5A3B};
const LOOK_HAIR={ink:0x3A3550,brown:0x6B4226,auburn:0xB5532A,flax:0xE3B75A,silver:0xB9C0CF,berry:0xD9628F};
const LOOK_WHITE=0xF4F1EA,LOOK_CHAR=0x2B2B3A;
const LOOKS={
  Elon:   {body:'B',face:'square',skin:'apricot',  hair:'H4',hairColor:'auburn',outfit:'G6',acc:['brows']},
  Jobs:   {body:'L',face:'long',  skin:'wheat',    hair:'H1',hairColor:'silver',outfit:'G2',acc:['roundGlasses','beard']},
  Buffett:{body:'R',face:'round', skin:'porcelain',hair:'H5',hairColor:'silver',outfit:'G1',acc:['squareGlasses','squint','blush']},

};
/* 以真人命名、性別明確的角色固定性別表現；其他人由代號決定，大約一半一半 */
const LOOK_GENDER={'investment-longterm':'f','brand-philosopher':'m','brand-storyteller':'m','content-director':'m','product-wizard':'m','sales-closer':'m',
  'network-architect':'m','growth-hacker':'m','community-builder':'m','media-director':'m','tw-stock-advisor':'m',
  'us-supply-advisor':'f','range-advisor':'m','futures-advisor':'m'};
const LOOK_SIGS=new Set(Object.values(LOOKS).map(l=>[l.hair,l.hairColor,l.outfit,l.body,l.face].join('|')));
const LOOK_DEPT_HAIR={}; /* 部門|髮色 → 人數 */
const LOOK_CACHE={};     /* 代號 → 算出來的造型（本尊、部門產線分身、v1 產線分身共用同一份） */
function lookRng(str,salt){ /* 代號 → 固定亂數序列；傳數字＝已經算好的雜湊（公開版改名的人用） */
  let h=2166136261;if(typeof str==='number')h=str;else for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  let a=(h+salt*977)|0;
  return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
}
const LOOK_SEED={'us-supply-advisor':-1223703981,'tw-stock-advisor':-1771812864,'futures-advisor':-407828791,'range-advisor':111669629,'intraday-advisor':1725531710,'investment-longterm':-1727591515,'investment-listing':-1480397532,'mispricing-hunter':1924843129,'media-director':1690523903,'sales-closer':-155971708,'network-architect':-1976113356,'growth-hacker':-487652708,'community-builder':-356244690,'brand-philosopher':268231135,'brand-storyteller':2089175445,'content-director':1078187297,'product-wizard':-1082941501,'chart-analyst':1880578565}; /* 公開版改名的人：沿用改名前的造型 */
function lookGen(agent){
  let look=null;
  for(let n=0;n<24;n++){ /* 撞到別人的整套造型、或同部門這個髮色已經 3 人，就換一組；最多試 24 次（第 12 次起不再管髮色人數） */
    const r=lookRng(LOOK_SEED[agent.code]??agent.code,n),pick=a=>a[Math.floor(r()*a.length)],chance=p=>r()<p;
    const coin=r()<.5?'f':'m',f=(LOOK_GENDER[agent.code]||coin)==='f';
    const skin=pick(['porcelain','apricot','apricot','wheat','wheat','honey','deep']);
    let colors=skin==='deep'?['auburn','silver','flax','berry','brown']:['ink','ink','brown','brown','auburn','flax','silver','berry'];
    if(agent.deptId==='ops')colors=colors.filter(c=>c!=='flax'); /* 金色部門不用金髮，頭髮會跟衣服糊在一起 */
    let hair=pick(f?['H6','H7','H8','H9','H10','H2','H6','H9','H7','H8']:['H1','H2','H3','H4','H10','H2','H1','H3','H4','H5']);
    let hairColor=pick(colors);
    if(hair==='H5')hairColor='silver';
    const body=pick(f?['S','S','M','M','L','R']:['M','M','L','R','B','S']);
    const face=pick(f?['round','round','small','small','long','square']:['round','square','square','long','small','long']);
    const outfit=pick(f?['G4','G4','G2','G3','G6L','G7','G5']:['G1','G2','G3','G5','G6','G7','G6']);
    const acc=[];
    const glasses=chance(.22);if(glasses)acc.push(chance(.5)?'roundGlasses':'squareGlasses');
    if(f){if(chance(.75))acc.push('lashes');if(chance(.6))acc.push('blush');if(chance(.3))acc.push('earrings');if(chance(.25)&&hair!=='H10')acc.push('hairclip');}
    else{if(chance(.15))acc.push('beard');if(chance(.25))acc.push('brows');if(chance(.15))acc.push('blush');}
    if(chance(.25))acc.push('smile');else if(!glasses&&chance(.08))acc.push('squint');
    if(chance(.07))acc.push('headphones');
    if(outfit==='G5'&&chance(.4))acc.push('bowtie');
    look={body,face,skin,hair,hairColor,outfit,acc,female:f};
    const sig=[hair,hairColor,outfit,body,face].join('|');
    const dk=agent.deptId+'|'+hairColor;
    if(!LOOK_SIGS.has(sig)&&((LOOK_DEPT_HAIR[dk]||0)<3||n>=12)){LOOK_SIGS.add(sig);LOOK_DEPT_HAIR[dk]=(LOOK_DEPT_HAIR[dk]||0)+1;break;}
  }
  return look;
}
/* 把一堆方塊併成一塊幾何（同一個人身上同材質的零件只畫一次）。
   不併的話全公司每幀多畫 700 多次，實測比舊款小人慢 2.7 倍（15.6ms vs 5.8ms）；併完一個人約 12 次，跟舊款差不多。 */
function lookMerge(geos){
  let n=0;geos.forEach(ge=>{n+=ge.attributes.position.array.length;});
  const pos=new Float32Array(n),nor=new Float32Array(n);let o=0;
  geos.forEach(ge=>{pos.set(ge.attributes.position.array,o);nor.set(ge.attributes.normal.array,o);o+=ge.attributes.position.array.length;ge.dispose();});
  const m=new THREE.BufferGeometry();
  m.setAttribute('position',new THREE.BufferAttribute(pos,3));m.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  return m;
}
function lookBox(w,h,d,x,y,z,ry,rz){
  const ge=new THREE.BoxGeometry(w,h,d).toNonIndexed();
  if(ry)ge.rotateY(ry);if(rz)ge.rotateZ(rz);
  ge.translate(x,y,z);return ge;
}
/* 工作帽（產線分身用；部門產線 dlClone 與 v1 產線 line-3d.js 共用）。
   有造型的人一律不戴：帽子會把髮型整個蓋住，一排看過去又變成同一個人，高髮型（油頭、刺蝟、丸子、蓬蓬捲）還會穿出帽子。
   分身跟本尊的差別改看「頭上沒有狀態燈」。只有 ?look=0 的舊款小人會戴。 */

/* 換主題：個人膚色髮色不跟主題換，衣服零件跟部門色走（office3d 與 line-3d.js 共用） */

  if(k.sleeveFixed)m.arm.color.setHex(LOOK_WHITE);else if(k.armAsBody)m.arm.color.set(u.zone.tone);

function personLook(agent,zone,px,pz,isCEO,look){
  const tone=new THREE.Color(zone.tone);
  const g=new THREE.Group();
  const B=LOOK_BODY[look.body],F=LOOK_FACE[look.face];
  const bw=look.bw||B[0],bh=B[1],bd=B[2],lg=B[3],W=F[0],H=F[1],D=F[2];
  const bodyTop=lg+bh,headY=bodyTop+H/2,HT=bodyTop+H,eyeY=headY-.06,fz=-(D/2),bz=-(bd/2),cy=lg+bh/2;
  const has=k=>look.acc.indexOf(k)>=0;
  const L=c=>new THREE.MeshLambertMaterial({color:c}),BM=c=>new THREE.MeshBasicMaterial({color:c});

  /* 零件先丟進「桶子」（掛在身上或頭上 × 哪個材質），最後每個桶子併成一塊。
     座標一律照「整個人」的高度寫；掛在頭上的桶子會自動換算成相對頭中心。 */
  const buckets=[],lazy={},darkMs=[];
  const bucket=(onHead,mat)=>{const b={onHead,mat,geos:[]};buckets.push(b);return b;};
  const put=(b,w,h,d,x,y,z,ry,rz)=>{b.geos.push(lookBox(w,h,d,x,b.onHead?y-headY:y,z,ry,rz));};
  const lz=(key,onHead,mk)=>lazy[key]||(lazy[key]=bucket(onHead,mk()));
  const bodyM=L(tone.clone()),skinM=L(LOOK_SKIN[look.skin]),hairM=L(LOOK_HAIR[look.hairColor]),eyeM=BM(0x111122),legM2=L(0x1a1a30);
  const bBody=bucket(false,bodyM),bHead=bucket(true,skinM),bHair=bucket(true,hairM),bEye=bucket(true,eyeM),bLeg=bucket(false,legM2);
  const bDark=()=>lz('dark',false,()=>{const m=L(tone.clone().multiplyScalar(.6));darkMs.push(m);return m;}); /* 深＝部門色×0.6，換主題要跟 */
  const bWhite=()=>lz('white',false,()=>L(LOOK_WHITE)),bChar=()=>lz('char',false,()=>L(LOOK_CHAR));
  const hWhite=()=>lz('hwhite',true,()=>BM(LOOK_WHITE)),hChar=()=>lz('hchar',true,()=>L(LOOK_CHAR));

  put(bBody,bw,bh,bd,0,cy,0);
  put(bHead,W,H,D,0,headY,0);

  /* ── 頭髮 ── */
  const hs=look.hair;let seat=.08,top=.08;
  const hair=(w,h,d,x,y,z,ry)=>put(bHair,w,h,d,x,y,z,ry);
  const backPiece=h=>hair(W+.04,h,.10,0,HT+.08-h/2,D/2+.02);
  const sidePieces=(w,h,d,z)=>[-1,1].forEach(sx=>hair(w,h,d,sx*(W/2+.02),HT+.06-h/2,z));
  if(hs==='H1'){hair(W+.04,.10,D+.04,0,HT-.01,0);seat=.06;top=.06;}                       /* 平頭 */
  else if(hs==='H5'){hair(W+.04,.22,.10,0,HT-.28,D/2);                                    /* 地中海：頭頂露膚色 */
    [-1,1].forEach(sx=>hair(.08,.22,D-.02,sx*(W/2+.02),HT-.28,.01));seat=0;top=0;}
  else if(hs==='H10'){hair(W+.18,.32,D+.18,0,HT+.04,0);backPiece(.30);seat=.20;top=.20;}   /* 蓬蓬捲 */
  else{
    hair(W+.04,.14,D+.04,0,HT+.01,0); /* 頭頂髮蓋 */
    if(hs==='H2'){backPiece(.28);hair(.44,.12,.08,.14,HT-.10,fz-.02);}                     /* 旁分 */
    if(hs==='H3'){backPiece(.28);hair(W,.16,.26,0,HT+.16,-.16);top=.24;}                   /* 油頭 */
    if(hs==='H4'){backPiece(.28);(isCEO?[-.24,.24]:[-.24,0,.24]).forEach(x=>hair(.16,.16,.16,x,HT+.16,0,Math.PI/4));top=.24;} /* 刺蝟 */
    if(hs==='H6'){backPiece(.52);sidePieces(.10,.46,D*.7,.06);hair(W,.12,.08,0,HT-.10,fz-.02);} /* 鮑伯 */
    if(hs==='H7'){backPiece(.26);hair(.18,.42,.18,0,HT-.16,D/2+.18);}                      /* 高馬尾 */
    if(hs==='H8'){backPiece(.26);[-.28,.28].forEach(x=>hair(.24,.24,.24,x,HT+.16,0));top=.28;} /* 雙丸子 */
    if(hs==='H9'){backPiece(.82);sidePieces(.08,.52,.30,.12);}                              /* 長直髮 */
  }

  /* ── 眼睛、臉、配件（都掛在頭上） ── */
  const glasses=has('roundGlasses')||has('squareGlasses');
  const ez=fz-(glasses?.035:.012),eh=has('squint')?.04:.14,ew=has('squint')?.14:.10;
  [-.18,.18].forEach(ex=>put(bEye,ew,eh,.03,ex,eyeY,ez));
  if(has('lashes')){[-.18,.18].forEach(x=>put(bEye,.15,.03,.03,x,eyeY+eh/2+.015,ez));}
  if(has('blush')){const b=bucket(true,BM(look.skin==='honey'||look.skin==='deep'?0xD9706A:0xFF9EAA));
    [-.27,.27].forEach(x=>put(b,.12,.06,.02,x,eyeY-.12,fz-(has('beard')?.016:.01)));} /* 有鬍子時往前一點，不然跟鬍子正面同平面會閃 */
  if(has('brows')){[-.18,.18].forEach(x=>hair(.14,.04,.03,x,eyeY+.13,fz-.012));}
  if(has('beard')){hair(W+.02,.20,.10,0,headY-H/2+.10,fz+.03);}
  if(has('smile')&&!has('beard')){put(hWhite(),.16,.05,.02,0,eyeY-.17,fz-.01);} /* 有鬍子的人嘴被蓋住，不畫 */
  if(has('squareGlasses')){[-.18,.18].forEach(x=>put(hWhite(),.18,.16,.02,x,eyeY,fz-.012));put(hChar(),.60,.04,.03,0,eyeY+.07,fz-.02);}
  if(has('roundGlasses')){
    [-.18,.18].forEach(x=>{const ge=new THREE.CylinderGeometry(.10,.10,.02,12).toNonIndexed();ge.rotateX(Math.PI/2);ge.translate(x,eyeY-headY,fz-.012);hWhite().geos.push(ge);});
    put(hChar(),.60,.035,.03,0,eyeY,fz-.02);}
  if(has('earrings')){const b=bucket(true,BM(0xFFD24D));[-1,1].forEach(sx=>put(b,.06,.06,.06,sx*(W/2+.03),headY-.20,-.04));}
  if(has('hairclip')){put(bucket(true,BM(0xFF7FA8)),.14,.05,.04,.22,HT-.13,fz-(hs==='H2'||hs==='H6'?.075:.035));} /* 有瀏海的髮型夾在瀏海外面 */
  if(has('headphones')){put(hChar(),W+.06,.05,.08,0,HT+.10,0);
    [-1,1].forEach(sx=>put(hChar(),.08,.18,.18,sx*(W/2+.04),headY,0));if(top<.13)top=.13;}

  /* ── 腳 ── */
  [-1,1].forEach(sx=>put(bLeg,.2,lg,.24,sx*bw*.26,lg/2,0));

  /* ── 服裝 ── */
  const of=look.outfit,whiteSleeve=of==='G5';
  if(of==='G1'){ /* 西裝領帶 */
    put(bWhite(),.16,.36,.02,0,bodyTop-.20,bz-.01);
    put(bucket(false,L(0xD9434F)),.07,.30,.03,0,bodyTop-.22,bz-.025);
    [-1,1].forEach(sx=>put(bDark(),.12,.32,.02,sx*.15,bodyTop-.19,bz-.012,0,sx*-.21));
  }
  if(of==='G2'){put(bDark(),bw+.04,.10,bd+.04,0,bodyTop-.05,0);put(bDark(),bw+.02,.08,bd+.02,0,lg+.04,0);} /* 高領毛衣 */
  if(of==='G3'){ /* 帽T：帽兜跟身體同色 */
    put(bBody,.46,.22,.18,0,bodyTop-.09,bd/2+.07);
    put(bDark(),.30,.14,.02,0,lg+.16,bz-.01);
    [-.07,.07].forEach(x=>put(bWhite(),.03,.16,.02,x,bodyTop-.12,bz-.01));
  }
  if(of==='G4'){ /* 洋裝：裙襬蓋住大半條腿 */
    const sh=Math.max(.12,lg-.14);
    put(bBody,bw+.18,sh,bd+.14,0,lg-sh/2,0);
    put(bDark(),bw+.03,.06,bd+.03,0,lg+.04,0);
  }
  if(whiteSleeve){put(bWhite(),.14,.44,.02,0,cy,bz-.01);} /* 襯衫背心：白袖＋胸口白條 */
  if(of==='G6'||of==='G6L'){ /* 開襟外套（G6L＝長版，多一圈下襬） */
    put(look.female?bWhite():bChar(),.20,.50,.02,0,cy,bz-.008);
    [-1,1].forEach(sx=>put(bDark(),.18,.50,.03,sx*.19,cy,bz-.016));
    if(of==='G6L')put(bDark(),bw+.06,.16,bd+.06,0,lg-.06,0);
  }
  if(has('bowtie')){put(bChar(),.18,.08,.04,0,bodyTop-.07,bz-.03);}

  /* ── 皇冠（掛在頭上） ── */
  let crownM=null;
  if(isCEO){
    crownM=new THREE.MeshLambertMaterial({color:0xffd700,emissive:0xffd700,emissiveIntensity:.4});
    const bc=bucket(true,crownM),cz=hs==='H3'?.12:0,cb=HT+seat+(has('headphones')?.05:0);
    put(bc,.36,.08,.36,0,cb+.04,cz);
    [-.14,0,.14].forEach(x=>put(bc,.08,.12,.08,x,cb+.14,cz));
    top=Math.max(top,cb-HT+.20);
    g.scale.setScalar(1.22);
  }

  /* ── 併塊、組裝：[0] 身體 [1] 頭（順序見上方 🔴），其餘桶子各一塊 ── */
  const meshOf=b=>new THREE.Mesh(lookMerge(b.geos),b.mat);
  g.add(meshOf(bBody));
  const head=meshOf(bHead);head.position.y=headY;g.add(head);
  buckets.forEach(b=>{if(b!==bBody&&b!==bHead&&b.geos.length)(b.onHead?head:g).add(meshOf(b));});
  /* 手：要單獨擺動，不併 */
  const armM=L(whiteSleeve?LOOK_WHITE:(of==='G2'?tone.clone():tone.clone().multiplyScalar(.75)));
  const arms=[-1,1].map(sx=>{
    const short=of==='G7'; /* 短袖：上半截是袖子，前臂是膚色，掛在袖子底下一起擺 */
    const a=new THREE.Mesh(new THREE.BoxGeometry(.14,short?.22:.46,.18),armM);
    a.position.set(sx*(bw/2+.07),bodyTop-(short?.13:.25),0);g.add(a);
    if(short){const fore=new THREE.Mesh(new THREE.BoxGeometry(.12,.26,.16),skinM);fore.position.y=-.24;a.add(fore);}
    return a;
  });

  /* ── 狀態燈、名牌：高度跟著髮型算 ── */
  const st=isCEO?'running':agent.st;
  const lampY=HT+top+.20,tagY=lampY+.60;
  const lampM=new THREE.MeshBasicMaterial({color:STC[st]||STC.running});
  const lamp=new THREE.Mesh(new THREE.SphereGeometry(.11,8,8),lampM);
  lamp.position.y=lampY;g.add(lamp);
  const nm=label(isCEO?agent.code:agent.role,42,CUR.label.person);
  nm.scale.set(6,1.5,1);nm.position.y=tagY;nm.userData.nameTag=true;g.add(nm);

  g.position.set(px,0,pz);
  g.userData={agent,zone,isCEO,home:new THREE.Vector3(px,0,pz),
    target:new THREE.Vector3(px,0,pz),phase:Math.random()*Math.PI*2,
    speed:.008+Math.random()*.007,wait:Math.random()*300,lamp,st,
    nameSprite:nm,look,tagY,headY,parts:{head,arms},

function layoutZone(zoneId,agents,isCEO){
  const z=ZONES[zoneId];
  const w=z.x1-z.x0-3,d=z.z1-z.z0-3;
  const n=agents.length;
  const cols=Math.ceil(Math.sqrt(n*(w/Math.max(d,1))))||1;
  const rows=Math.ceil(n/cols);
  agents.forEach((a,i)=>{
    const c=i%cols,r=Math.floor(i/cols);
    const px=z.x0+1.5+(w/(cols))*(c+.5);
    const pz=z.z0+1.5+(d/(rows))*(r+.5);
    if(!isCEO)scene.add(desk(px,pz-1.05,zoneId));
    person(a,z,px,pz,isCEO);
  });
}

function dlBeltTex(tone){

}

/* ── 產線上的動作（2026-11-12 James：平常就要動——帶面跑＋光點流動、小人在崗位工作，還要走去輸送帶再走回來）──
   每一站同一時間只有一個人離開座位：輪到的人走到兩排座位中間的走道、繞過桌子右邊走到輸送帶邊，處理一下再原路走回來。
   姿勢完全由時間算出來（dlPose 不存狀態），所以分身跟「上產線」時的本尊走同一套，開機自檢也能把整輪掃一遍。
   輸送帶上只有光點，不放箱子：這 9 條線還沒接即時帳本，放箱子會像真的有工單在跑。 */
const DL_TURN=11,DL_SPD=1.7,DL_HOLD=1.8,DL_BELT=1.26; /* 每人一輪 11 秒：走過去、在帶邊停 1.8 秒、走回來，其餘時間在座位；帶速 1.26 單位／秒 */
function dlPose(u,et){
  const s=u.lineSlot,w=u.lineWalk,ts=et+w.off,desk={x:s.x,z:s.z,ry:0,stage:'desk'};
  if(Math.floor(ts/DL_TURN)%w.turns!==w.k)return desk;
  const t=ts%DL_TURN,tw=w.len/DL_SPD;
  let d,back=false;
  if(t<tw)d=t*DL_SPD;
  else if(t<tw+DL_HOLD)return {x:w.pts[3][0],z:w.pts[3][1],ry:0,stage:'belt'};
  else if(t<tw*2+DL_HOLD){d=w.len-(t-tw-DL_HOLD)*DL_SPD;back=true;}
  else return desk;
  for(let i=0;i<3;i++){
    const a=w.pts[i],b=w.pts[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(d<=L||i===2){const f=Math.min(1,d/L),sg=back?-1:1;
      return {x:a[0]+(b[0]-a[0])*f,z:a[1]+(b[1]-a[1])*f,ry:Math.atan2((b[0]-a[0])*sg,(b[1]-a[1])*sg)+Math.PI,stage:'walk'};}
    d-=L;

function dlAnimate(p,et){
  const u=p.userData,q=dlPose(u,et),a=u.arms;
  p.position.x=q.x;p.position.z=q.z;
  if(q.stage==='walk'){ /* 走路：手前後擺、小跳 */
    const k=Math.sin(et*10+u.phase)*.6;a[0].rotation.x=k;a[1].rotation.x=-k;
    p.position.y=Math.abs(Math.sin(et*10+u.phase))*.07;p.rotation.y=q.ry;
  }else if(q.stage==='belt'){ /* 在輸送帶邊：面向帶子，兩手往前伸 */
    const k=1+Math.sin(et*9+u.phase)*.25;a[0].rotation.x=k;a[1].rotation.x=k;
    p.position.y=0;p.rotation.y=0;

    const k=Math.sin(et*11+u.phase)*.38;a[0].rotation.x=k;a[1].rotation.x=-k;

}
/* 把每條線的整輪動作模擬一遍。傳入 pose 函式是為了能拿壞掉的版本來驗這個檢查本身會不會叫

function dlMotionCheck(pose){
  const bad=new Set(),STEP=.2,gcd=(a,b)=>b?gcd(b,a%b):a;
  DL.lanes.forEach(l=>{
    const ws=l.workers.filter(u=>u.st!=='frozen');if(!ws.length)return;
    /* 各站輪數不同，取最小公倍數才是整條線的一整輪 */
    const cyc=ws.reduce((m,u)=>m*u.lineWalk.turns/gcd(m,u.lineWalk.turns),1)*DL_TURN,seen=new Set();
    let prev=null;
    for(let t=0;t<cyc;t+=STEP){
      const qs=ws.map(u=>pose(u,t)),out={};
      qs.forEach((q,n)=>{const u=ws[n],who=u.agent.code;
        if(!q){bad.add(who+' 算不出姿勢');return;}
        if(q.stage!=='desk'){const i=u.lineStation.idx;out[i]=(out[i]||0)+1;if(q.stage==='belt')seen.add(u);
          qs.forEach((o,m)=>{if(m!==n&&o&&Math.hypot(o.x-q.x,o.z-q.z)<.45)bad.add(who+' 走路時撞到 '+ws[m].agent.code);});}
        else if(q.x!==u.lineSlot.x||q.z!==u.lineSlot.z)bad.add(who+' 在座位時不在自己的位置');
        if(prev&&prev[n]&&Math.hypot(q.x-prev[n].x,q.z-prev[n].z)>DL_SPD*STEP+.02)bad.add(who+' 瞬間移動');
        if(q.x<l.x0||q.x>l.x1||q.z<l.z0||q.z>l.z1)bad.add(who+' 走出產線地板');
        if(q.z<l.bz+.75)bad.add(who+' 走上輸送帶');
        if(l.desks.some(sx=>Math.abs(q.x-sx)<1.28&&Math.abs(q.z-l.deskZ)<.86))bad.add(who+' 穿過桌子'); /* 桌子半寬 .95、半深 .5，再留半個身寬 */
      });
      Object.keys(out).forEach(i=>{if(out[i]>1)bad.add(l.name+' 第 '+(+i+1)+' 站同時有 '+out[i]+' 個人離開座位');});
      prev=qs;
    }
    ws.forEach(u=>{if(!seen.has(u))bad.add(u.agent.code+' 一整輪都沒走到輸送帶');});
  });
  return [...bad];
}

/* ── 董事長遊戲:全員開會 / 茶水間 / 回工作 ── */
let MODE='work',lastBub=0;
const toastEl=document.createElement('div');toastEl.className='toast';document.body.appendChild(toastEl);
let toastT=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2800);}
function bubble(p,text){

const MEET_TXT=['收到!','馬上到!','Yes Sir!','📈','💡','衝!','$$$','筆記中📝'];
const BRK_TXT=['☕','🍰','😄','哈哈','🎮','摸魚中'];
function randIn(z){return new THREE.Vector3(
  z.x0+1.2+Math.random()*(z.x1-z.x0-2.4),0,
  z.z0+1.2+Math.random()*(z.z1-z.z0-2.4));}
function warSeats(n){
  const w=ZONES.war,seats=[],cols=12;
  for(let i=0;i<n;i++){
    const c=i%cols,r=Math.floor(i/cols);
    seats.push(new THREE.Vector3(
      w.x0+1.4+c*((w.x1-w.x0-2.8)/(cols-1)),0,w.z0+5.5+r*0.95));
  }
  return seats;
}
function camGo(target,pos){
  const f=camera.position.clone(),ft=controls.target.clone(),t0=performance.now();
  camTween=(t)=>{const q=Math.min((t-t0)/800,1),e=1-Math.pow(1-q,3);
    camera.position.lerpVectors(f,pos,e);controls.target.lerpVectors(ft,target,e);
    if(q>=1)camTween=null;};
}
function setMode(m,btn){
  clearSpotlight();

  window.__dlLine=(m==='line');
  if(m!=='line'){people.forEach(p=>{p.userData.arrived=false;dlTag(p,false);});}

  const w=ZONES.war,bz=ZONES.brk;

    const seats=warSeats(emp.length);
    emp.forEach((p,i)=>{

    });
    people.filter(p=>p.userData.isCEO).forEach((p,i)=>{

      if(MODE!=='line')return;

/* ── 三主題即時切換(🌙 午夜 → 📰 日報 → 🔥 地心)── */
function applyTheme(name){
  if(!THEMES[name])name='midnight';
  const T=THEMES[name];
  CUR=T;CUR_NAME=name;

  /* 1) CSS 變數 */
  const R=document.documentElement.style,C=T.css,U=T.ui;
  R.setProperty('--bg',C.bg);R.setProperty('--panel',C.panel);
  R.setProperty('--border',C.border);R.setProperty('--text',C.text);
  R.setProperty('--accent',C.accent);R.setProperty('--gold',C.gold);
  R.setProperty('--green',C.green);R.setProperty('--orange',C.orange);R.setProperty('--red',C.red);
  R.setProperty('--font-pixel',T.font.pixel);
  R.setProperty('--ui-bar-bg',U.barBg);R.setProperty('--ui-legend-bg',U.legendBg);
  R.setProperty('--ui-info-bg',U.infoBg);R.setProperty('--ui-todo-bg',U.todoBg);
  R.setProperty('--ui-hint',U.hint);R.setProperty('--ui-infotext',U.infoText);
  R.setProperty('--hover-border',U.hoverBorder);R.setProperty('--hover-glow',U.hoverGlow);
  R.setProperty('--btn-on-bg',U.btnOnBg);R.setProperty('--btn-on-border',U.btnOnBorder);R.setProperty('--btn-on-text',U.btnOnText);
  R.setProperty('--gold-dim',U.goldDim);R.setProperty('--btn-game-on-text',U.btnGameOnText);
  R.setProperty('--shadow-ink',U.shadowInk);R.setProperty('--title-shadow',U.titleShadow);
  R.setProperty('--toast-bg',U.toastBg);R.setProperty('--toast-text',U.toastText);
  R.setProperty('--toast-border',U.toastBorder);R.setProperty('--toast-shadow',U.toastShadow);
  R.setProperty('--todo-row-bg',U.todoRowBg);R.setProperty('--todo-row-hover',U.todoRowHover);
  R.setProperty('--fx-overlay',T.fx.overlay);
  document.body.className='theme-'+name;

  /* 2) 場景基礎 + 三盞燈 */
  scene.background.setHex(T.scene.bg);
  scene.fog.color.setHex(T.scene.fog);scene.fog.near=T.scene.fogNear;scene.fog.far=T.scene.fogFar;
  amb.color.setHex(T.light.ambient);amb.intensity=T.light.ambientI;
  dir.color.setHex(T.light.dir);dir.intensity=T.light.dirI;
  pt.color.setHex(T.light.point);pt.intensity=T.light.pointI;pt.distance=T.light.pointDist;
  REG.ground.color.setHex(T.ground.floor);

  /* 3) GridHelper 顏色是頂點色 → 移除舊的、dispose、重建 */
  scene.remove(REG.grid);
  REG.grid.geometry.dispose();REG.grid.material.dispose();
  REG.grid=new THREE.GridHelper(200,100,T.grid.main,T.grid.sub);
  REG.grid.position.y=0;scene.add(REG.grid);

  /* 4) ZONES tone/color 全域更新(聚光/legend/名牌共用來源)+ 地板 + 矮牆 */
  Object.keys(ZONES).forEach(id=>{
    const zt=T.zone[id];if(!zt)return;
    ZONES[id].color=zt.color;ZONES[id].tone=zt.tone;
    if(REG.zoneFloor[id])REG.zoneFloor[id].color.setHex(zt.color);
  });
  REG.wallMats.forEach(m=>m.color.setHex(T.scene.wall));

  /* 5) 狀態燈三色全域更新(綠=運轉/橘=待命/灰=凍結 語意鎖死) */
  STC.running=T.lamp.running;STC.standby=T.lamp.standby;STC.frozen=T.lamp.frozen;

  /* 6) 家具 */
  const F=REG.furniture,FT=T.furniture;
  F.warTable.color.setHex(FT.warTable);
  F.warGlow.color.setHex(FT.warGlow);
  F.warScreen.color.setHex(FT.warScreen);
  F.warScreen.emissive.setHex(FT.warScreenEmis);F.warScreen.emissiveIntensity=FT.warScreenEmisI;
  F.coffee.color.setHex(FT.coffee);F.coffee.emissive.setHex(FT.coffeeEmis);F.coffee.emissiveIntensity=FT.coffeeEmisI;
  F.vending.color.setHex(FT.vending);F.vending.emissive.setHex(FT.vendingEmis);F.vending.emissiveIntensity=FT.vendingEmisI;
  F.brkTops.forEach(m=>m.color.setHex(FT.tableTop));
  F.brkLegs.forEach(m=>m.color.setHex(FT.tableLeg));

  /* 7) 桌子(桌板/腳/螢幕;emissive 跟新 zone tone) */
  REG.desks.forEach(d=>{
    d.top.color.setHex(T.desk.top);d.leg.color.setHex(T.desk.leg);
    d.mon.color.setHex(T.desk.screen);
    d.mon.emissive.set(ZONES[d.zoneId].tone);
    d.mon.emissiveIntensity=T.desk.screenEmisI;
  });

  /* 8) 小人部位 + 名牌重烤（含產線分身） */
  people.concat(DL.clones).forEach(p=>{
    const u=p.userData,m=u.mats;
    if(u.capM){u.capM.color.set(u.zone.tone);u.capM.color.multiplyScalar(.75);}
    m.body.color.set(u.zone.tone);
    m.arm.color.set(u.zone.tone);m.arm.color.multiplyScalar(.75);
    if(u.look)lookRetheme(p);
    else{
      m.skin.color.setHex(T.person.skin);
      m.hair.color.setHex(u.isCEO?T.person.hairCEO:T.person.hair);
    }
    m.eye.color.setHex(T.person.eye);
    m.leg.color.setHex(T.person.leg);
    m.lamp.color.setHex(STC[u.st]||STC.running);
    if(m.crown){m.crown.color.setHex(T.person.hairCEO);m.crown.emissive.setHex(T.person.hairCEO);}
    rebuildPersonLabel(p);
  });

  /* 9) 房名牌重烤 + legend inline 色塊重繪 */
  rebuildZoneLabels();
  renderLegend();

  /* 10) 聚光進行中:chip 用新主題重生成、暗化重套(冪等) */
  if(spotProj){
    const set=new Set(spotProj.agents||[]);
    people.forEach(p=>{
      const code=p.userData.agent&&p.userData.agent.code;
      if(set.has(code)){removeChip(p);addChip(p,spotProj.name);}
      else setPersonDim(p,true);
    });
  }

  /* 11) 收尾:按鈕文字 + 記住選擇 */
  const tb=document.getElementById('bTheme');
  if(tb)tb.textContent=THEME_BTN[name];
  try{localStorage.setItem('office3d.theme',name);}catch(e){}
}

/* ── 動畫:idle 呼吸 + 房間內漫步 ── */
const clock=new THREE.Clock();
/* ?rec=1920|1280：錄影模式把畫布鎖在 16:9 固定解析度（字級規格才成立，SPEC §4.2） */
const REC_Q=+new URLSearchParams(location.search).get('rec');
const REC_W=(REC_Q===1280||REC_Q===1920)?REC_Q:0;
function resize(){
  const w=REC_W||innerWidth,h=REC_W?Math.round(REC_W*9/16):innerHeight;
  renderer.setSize(w,h,false);
  if(REC_W){canvas.style.inset='auto';canvas.style.left='0';canvas.style.top='0';canvas.style.width=w+'px';canvas.style.height=h+'px';
    const de=document.documentElement.style,bd=document.body.style;
    de.width=bd.width=w+'px';de.height=bd.height=h+'px';de.overflow=bd.overflow='hidden';
    bd.transform='translateZ(0)'; /* body 成為 position:fixed 後代的包含塊，HUD 才會貼在 W×H 內 */
    if(innerWidth!==w||innerHeight!==h)console.warn('REC 建議視窗剛好 '+w+'×'+h+'，目前 '+innerWidth+'×'+innerHeight);}
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let rafAlive=false;
function tick(t){
  rafAlive=true;
  requestAnimationFrame(tick);
  step(t);
}
function step(t){
  const et=clock.getElapsedTime();
  if(camTween)camTween(t);
  { /* 平移邊界：超出就把相機跟視角中心一起拉回來 */
    const tg=controls.target,bx=THREE.MathUtils.clamp(tg.x,PAN_BOUNDS.x0,PAN_BOUNDS.x1),bz=THREE.MathUtils.clamp(tg.z,PAN_BOUNDS.z0,PAN_BOUNDS.z1);
    if(bx!==tg.x||bz!==tg.z){camera.position.x+=bx-tg.x;camera.position.z+=bz-tg.z;tg.x=bx;tg.z=bz;}
  }
  controls.update();
  /* 分身只在本尊不在崗位上時出現：上產線時本尊站在那裡；離開產線後本尊走開了才換分身（規格審：不准兩個疊在一起） */
  for(const c of DL.clones){
    if(MODE==='line'){c.visible=false;continue;}
    if(!reduce)dlAnimate(c,et); /* 先算分身此刻站哪，再判斷會不會跟本尊疊在一起；藏著的分身也要算，不然比到的是它上次露面的位置 */
    const o=c.userData.orig.position;c.visible=Math.hypot(o.x-c.position.x,o.z-c.position.z)>1.2;
  }
  if(!reduce){
    DL.clones.forEach(c=>{if(!c.visible)return;const u=c.userData;u.parts.head.position.y=(u.headY||1.5)+Math.sin(et*3+u.phase)*.04;});
    people.forEach(p=>{
      const u=p.userData;
      // idle bob
      u.parts.head.position.y=(u.headY||1.5)+Math.sin(et*3+u.phase)*.04; // head（有造型的人頭髮、眼鏡都掛在頭上，一起動）
      p.position.y=Math.abs(Math.sin(et*4+u.phase))*.03;
      // 移動(凍結部門的人不動;依模式決定目的地)
      if(u.st==='frozen')return;
      let goal;
      if(MODE==='work'||!u.go){
        u.wait--;
        if(u.wait<=0){
          const z=u.zone,r=u.isCEO?1.2:2.2;
          u.target.set(
            THREE.MathUtils.clamp(u.home.x+(Math.random()*2-1)*r,z.x0+1,z.x1-1),0,
            THREE.MathUtils.clamp(u.home.z+(Math.random()*2-1)*r,z.z0+1,z.z1-1));
          u.wait=200+Math.random()*500;
        }
        goal=u.target;
      }else{
        goal=u.go;
        if(MODE==='break'){ // 茶水間內繼續閒晃
          u.wait--;
          if(u.wait<=0){u.go=randIn(ZONES.brk);u.wait=150+Math.random()*350;}
        }
      }
      const dx=goal.x-p.position.x,dz=goal.z-p.position.z;
      const dist=Math.hypot(dx,dz);
      const spd=(MODE==='work')?u.speed*2:u.speed*5; // 董事長一喊,腳步加快
      if(MODE==='line'&&u.arrived){
        dlAnimate(p,et); /* 到位後跟分身走同一套：在座位工作、輪到就走去輸送帶再回來 */
      }else if(dist>.08){
        p.position.x+=dx*spd;p.position.z+=dz*spd;
        p.rotation.y=Math.atan2(dx,dz)+Math.PI; // 臉朝 -z,轉向移動方向
      }else if(MODE==='line'&&u.go){
        p.rotation.y=0; /* 面向輸送帶 */
        if(u.arms){const k=Math.sin(et*11+u.phase)*.38;u.arms[0].rotation.x=k;u.arms[1].rotation.x=-k;}
        /* 輪到他離座的那幾秒先不接手，不然會從座位直接跳到路線中段（規範審 2026-11-12）；最多多站 7 秒 */
        if(!u.arrived&&dlPose(u,et).stage==='desk'){u.arrived=true;if(Math.random()<.3)bubble(p,'就位 '+u.lineStation.name);}
      }else if(MODE==='meeting'&&u.go){
        // 就座:員工面向大螢幕,CEO 面向群眾
        const w=ZONES.war,cx=(w.x0+w.x1)/2;
        const fp=u.isCEO?{x:cx,z:w.z0+6.5}:{x:cx,z:w.z0+.45};
        p.rotation.y=Math.atan2(fp.x-p.position.x,fp.z-p.position.z)+Math.PI;
      }
      if(MODE!=='line'&&u.arms&&u.arms[0].rotation.x){u.arms[0].rotation.x=0;u.arms[1].rotation.x=0;}
      // 隨機冒泡(開會認真、茶水間耍廢、產線上報工站)
      if(MODE==='line'&&u.arrived&&et-lastBub>1.5&&Math.random()<.01){
        lastBub=et;bubble(p,'⚙️ '+u.lineStation.name.replace(/[①-⑨]/g,''));
      }else if(MODE==='meeting'&&dist<.5&&et-lastBub>1.3&&Math.random()<.02){
        lastBub=et;bubble(p,MEET_TXT[Math.floor(Math.random()*MEET_TXT.length)]);
      }else if(MODE==='break'&&et-lastBub>1.8&&Math.random()<.015){
        lastBub=et;bubble(p,BRK_TXT[Math.floor(Math.random()*BRK_TXT.length)]);
      }
      // 狀態燈呼吸（聚光選中最強、green 專案較強、其餘一般）
      u.lamp.material.opacity=1;
      const amp = u.hl?0.6 : (u.hot?0.45:0.25);
      u.lamp.scale.setScalar(1+Math.sin(et*3+u.phase)*amp);
    });
  }
  if(!reduce){
    const run=et*DL_BELT;
    DL.belts.forEach(b=>{if(!b.live)return;
      b.tex.offset.x=-(run/1.4%1); /* 紋路一格 1.4 單位，往最後一站的方向跑 */
      b.lights.forEach((m,i)=>{const f=(run/b.bl+i/b.lights.length)%1;m.visible=true;m.position.x=b.bx0+f*b.bl;m.material.opacity=.8*Math.sin(Math.PI*f);});}); /* 兩端淡入淡出 */
    DL.screens.forEach(s=>{s.m.emissiveIntensity=s.on?.55+.35*Math.sin(et*4+s.ph):.06;});
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(tick);
// 首幀同步畫一次（背景分頁 rAF 會被暫停，見 MERIDIAN 坑：改用 setTimeout 後備）
step(performance.now());
setTimeout(()=>{
  if(!rafAlive){
    setInterval(()=>{ if(!rafAlive) step(performance.now()); },50);
  }
},600);
try{const q=new URLSearchParams(location.search);
  if(!q.has('rec')&&!q.has('replay')){
    const sm=q.get('mode')||localStorage.getItem('office3d.mode');
    if(sm==='line')setTimeout(()=>setMode('line',document.getElementById('gLine')),700);
  }}catch(e){}

/* ── Jarvis 語音層接口：把辦公室能力匯出給 voice-overlay（存在才會用到）── */
window.OFFICE_API={agentByCode,bubble,toast,spotlight,clearSpotlight,camGo,ZONES,people,projects:D.projects,
  /* 出貨月台（dock-overlay.js / dock-3d.js）用 */
  roster:ALL,THREE,scene,camera,controls,zoneLabels:REG.zoneLabel,
  isBusy:()=>interacting||!!camTween||performance.now()-lastMove<120,isUserBusy:()=>interacting||!!camTween,theme:()=>CUR
  /* 自動發文產線（line-3d.js / line-card.js）用 */
  ,themeName:()=>CUR_NAME,label,person,addCap,lookRetheme,
  lineCamActive:false};
